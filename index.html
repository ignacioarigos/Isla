<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Isla 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #faf7f2;
    --ink: #2c2416;
    --muted: #8a7d6b;
    --border: #d4c9b5;
    --eugenia: #c0392b;
    --eugenia-light: #f5d5d2;
    --malvina: #2471a3;
    --malvina-light: #d2e8f5;
    --enrique: #1e8449;
    --enrique-light: #d2f0dc;
    --ramon: #7d6608;
    --ramon-light: #f5eec2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  header { text-align: center; margin-bottom: 32px; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.6rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1;
  }

  header p {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .leyenda {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .leyenda-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink);
  }

  .leyenda-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 16px;
  }

  .nav button {
    background: none;
    border: 1.5px solid var(--border);
    color: var(--ink);
    padding: 7px 18px;
    border-radius: 4px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav button:hover { background: var(--border); }

  .nav h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    min-width: 210px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .cal-wrap {
    max-width: 860px;
    margin: 0 auto;
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(44,36,22,0.08);
  }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    background: var(--ink);
    color: var(--bg);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 0;
    text-align: center;
  }

  tbody td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    width: 14.28%;
    height: 82px;
    vertical-align: top;
    cursor: pointer;
    transition: filter 0.1s;
  }

  tbody td:hover { filter: brightness(0.93); }
  tbody td.vacio { background: var(--bg); cursor: default; }
  tbody td.vacio:hover { filter: none; }

  td.Eugenia { background: var(--eugenia-light); }
  td.Malvina { background: var(--malvina-light); }
  td.Enrique { background: var(--enrique-light); }
  td.Ramon   { background: var(--ramon-light); }

  .fecha-num {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .asig-chip {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 12px;
    color: #fff;
    margin-bottom: 2px;
  }

  .chip-Eugenia { background: var(--eugenia); }
  .chip-Malvina { background: var(--malvina); }
  .chip-Enrique { background: var(--enrique); }
  .chip-Ramon   { background: var(--ramon); }

  .tipo-label {
    display: block;
    font-size: 0.63rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.03em;
  }

  .info-panel {
    max-width: 860px;
    margin: 16px auto 0;
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 0.88rem;
    color: var(--muted);
    min-height: 52px;
    line-height: 1.6;
  }

  .info-panel strong { color: var(--ink); }

  @media (max-width: 600px) {
    header h1 { font-size: 1.8rem; }
    tbody td { height: 60px; padding: 4px 4px; }
    .asig-chip { font-size: 0.63rem; padding: 1px 5px; }
    .tipo-label { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🏝 La Isla · 2026</h1>
  <p>Sorteo de asignaciones · 2026</p>
</header>

<div class="leyenda">
  <div class="leyenda-item"><div class="leyenda-dot" style="background:var(--eugenia)"></div> Eugenia</div>
  <div class="leyenda-item"><div class="leyenda-dot" style="background:var(--malvina)"></div> Malvina</div>
  <div class="leyenda-item"><div class="leyenda-dot" style="background:var(--enrique)"></div> Enrique</div>
  <div class="leyenda-item"><div class="leyenda-dot" style="background:var(--ramon)"></div> Ramón</div>
</div>

<div class="nav">
  <button id="btn-prev">← Anterior</button>
  <h2 id="mes-titulo"></h2>
  <button id="btn-next">Siguiente →</button>
</div>

<div class="cal-wrap">
  <table>
    <thead>
      <tr>
        <th>Dom</th><th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="info-panel" id="info">Hacé clic en cualquier fecha para ver el detalle de la asignación.</div>

<script>
(() => {

  // ── HELPERS ─────────────────────────────────────────────────────────────────

  function fmt(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  // Prioridad: mayor número no se sobreescribe
  const PRIO = {
    'Quincena': 10,
    'Semana Santa': 9,
    'Vacaciones julio': 8,
    'Fin de semana largo': 6,
    'Año Nuevo': 5,
    'Fin de semana': 4,
  };

  const asignaciones = {};

  function setRango(desde, hasta, persona, tipo) {
    const d = new Date(desde + 'T12:00:00');
    const h = new Date(hasta + 'T12:00:00');
    const p = PRIO[tipo] || 1;
    while (d <= h) {
      const f = fmt(d);
      if (!asignaciones[f] || asignaciones[f].prio < p) {
        asignaciones[f] = { persona, tipo, prio: p };
      }
      d.setDate(d.getDate() + 1);
    }
  }

  // Dado el sábado de un fin de semana, devuelve [jue anterior, mié siguiente]
  function thuWedDesdeSab(sabStr) {
    const sab = new Date(sabStr + 'T12:00:00');
    const jue = new Date(sab); jue.setDate(jue.getDate() - 2); // jue = sab - 2
    const mie = new Date(sab); mie.setDate(mie.getDate() + 4); // mié = sab + 4
    return [fmt(jue), fmt(mie)];
  }

  // Dado un rango de días festivos, extiende al jue anterior y mié posterior
  function thuWedDesdeRango(iniStr, finStr) {
    const ini = new Date(iniStr + 'T12:00:00');
    const fin = new Date(finStr + 'T12:00:00');
    const jue = new Date(ini);
    while (jue.getDay() !== 4) jue.setDate(jue.getDate() - 1);
    const mie = new Date(fin);
    while (mie.getDay() !== 3) mie.setDate(mie.getDate() + 1);
    return [fmt(jue), fmt(mie)];
  }

  // ── DATOS 2026 ───────────────────────────────────────────────────────────────

  // QUINCENAS VERANO 2026 (enero/feb 2026): Ramón – Eugenia – Malvina – Enrique
  setRango('2026-01-02', '2026-01-16', 'Ramon',   'Quincena');
  setRango('2026-01-17', '2026-01-31', 'Eugenia', 'Quincena');
  setRango('2026-02-01', '2026-02-16', 'Malvina', 'Quincena');
  setRango('2026-02-17', '2026-03-02', 'Enrique', 'Quincena');

  // SEMANA SANTA 2026 → Malvina
  // Jueves Santo 2/4, Viernes Santo 3/4, Sábado 4/4, Domingo Pascua 5/4
  // Extendido: jue 2/4 → mié 8/4 (ya es jueves el primer día, retrocedemos al jue de la semana anterior)
  {
    const [j, m] = thuWedDesdeRango('2026-04-02', '2026-04-05');
    setRango(j, m, 'Malvina', 'Semana Santa');
  }

  // FINES DE SEMANA LARGOS 2026 (extendidos jue–mié)
  const fdsLargos = [
    ['2026-03-21', '2026-03-24', 'Eugenia'],
    ['2026-05-01', '2026-05-03', 'Malvina'],
    ['2026-05-23', '2026-05-25', 'Ramon'],
    ['2026-06-13', '2026-06-15', 'Eugenia'],
    ['2026-07-09', '2026-07-12', 'Enrique'],
    ['2026-08-15', '2026-08-17', 'Malvina'],
    ['2026-10-10', '2026-10-12', 'Eugenia'],
    ['2026-11-21', '2026-11-23', 'Enrique'],
    ['2026-12-05', '2026-12-08', 'Ramon'],
    ['2026-12-25', '2026-12-27', 'Malvina'],
  ];

  fdsLargos.forEach(([ini, fin, persona]) => {
    const [j, m] = thuWedDesdeRango(ini, fin);
    setRango(j, m, persona, 'Fin de semana largo');
  });

  // AÑO NUEVO → Enrique (jue 31/12 al mié 6/1/2027)
  {
    const [j, m] = thuWedDesdeRango('2026-12-31', '2027-01-01');
    setRango(j, m, 'Enrique', 'Año Nuevo');
  }

  // VACACIONES JULIO 2026
  // 1ra semana: sáb 18/7 al dom 26/7 → Enrique
  setRango('2026-07-18', '2026-07-26', 'Enrique', 'Vacaciones julio');
  // 2da semana: lun 27/7 al dom 2/8 → Eugenia
  setRango('2026-07-27', '2026-08-02', 'Eugenia', 'Vacaciones julio');

  // FINES DE SEMANA COMUNES 2026 (jue–mié, a partir del sábado listado)
  // El doc lista sáb-dom; expandimos al jue anterior y mié siguiente
  const fdsComunes = [
    ['2026-03-07',  'Malvina'],
    ['2026-03-14',  'Enrique'],
    ['2026-03-28',  'Ramon'],
    ['2026-04-11',  'Eugenia'],
    ['2026-04-18',  'Malvina'],
    ['2026-04-25',  'Enrique'],
    ['2026-05-09',  'Ramon'],
    ['2026-05-16',  'Eugenia'],
    ['2026-05-30',  'Malvina'],
    ['2026-06-06',  'Enrique'],
    ['2026-06-20',  'Ramon'],
    ['2026-06-27',  'Eugenia'],
    ['2026-07-04',  'Malvina'],
    ['2026-08-08',  'Enrique'],
    ['2026-08-22',  'Ramon'],
    ['2026-08-29',  'Eugenia'],
    ['2026-09-05',  'Malvina'],
    ['2026-09-12',  'Enrique'],
    ['2026-09-19',  'Ramon'],
    ['2026-09-26',  'Eugenia'],
    ['2026-10-03',  'Malvina'],
    ['2026-10-17',  'Enrique'],
    ['2026-10-24',  'Ramon'],
    ['2026-10-31',  'Eugenia'],
    ['2026-11-07',  'Malvina'],
    ['2026-11-14',  'Enrique'],
    ['2026-11-28',  'Ramon'],
    ['2026-12-12',  'Malvina'],
    ['2026-12-19',  'Enrique'],
  ];

  fdsComunes.forEach(([sab, persona]) => {
    const [j, m] = thuWedDesdeSab(sab);
    setRango(j, m, persona, 'Fin de semana');
  });

  // ── RENDER ───────────────────────────────────────────────────────────────────

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const TIPO_LABEL = {
    'Quincena':            'Quincena verano',
    'Semana Santa':        'Semana Santa',
    'Fin de semana largo': 'FS largo',
    'Vacaciones julio':    'Vacaciones julio',
    'Fin de semana':       'Fin de semana',
    'Año Nuevo':           'Año Nuevo',
  };

  const COLORES = {
    Eugenia: '#c0392b', Malvina: '#2471a3', Enrique: '#1e8449', Ramon: '#7d6608'
  };

  const ANIO = 2026;
  let mesActual = 0;

  function renderMes(m) {
    document.getElementById('mes-titulo').textContent = MESES[m] + ' ' + ANIO;
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    const primerDia = new Date(ANIO, m, 1).getDay();
    const diasMes   = new Date(ANIO, m + 1, 0).getDate();

    let fila = document.createElement('tr');

    for (let i = 0; i < primerDia; i++) {
      const td = document.createElement('td');
      td.classList.add('vacio');
      fila.appendChild(td);
    }

    for (let dia = 1; dia <= diasMes; dia++) {
      const fechaStr = ANIO + '-' + String(m+1).padStart(2,'0') + '-' + String(dia).padStart(2,'0');
      const asig = asignaciones[fechaStr];

      const td = document.createElement('td');
      td.dataset.fecha = fechaStr;

      const numDiv = document.createElement('div');
      numDiv.className = 'fecha-num';
      numDiv.textContent = dia;
      td.appendChild(numDiv);

      if (asig) {
        td.classList.add(asig.persona);

        const chip = document.createElement('span');
        chip.className = 'asig-chip chip-' + asig.persona;
        chip.textContent = asig.persona === 'Ramon' ? 'Ramón' : asig.persona;
        td.appendChild(chip);

        const lbl = document.createElement('span');
        lbl.className = 'tipo-label';
        lbl.textContent = TIPO_LABEL[asig.tipo] || asig.tipo;
        td.appendChild(lbl);
      }

      td.addEventListener('click', () => mostrarInfo(fechaStr));
      fila.appendChild(td);

      if ((primerDia + dia) % 7 === 0) {
        tbody.appendChild(fila);
        fila = document.createElement('tr');
      }
    }

    if (fila.children.length > 0) {
      while (fila.children.length < 7) {
        const td = document.createElement('td');
        td.classList.add('vacio');
        fila.appendChild(td);
      }
      tbody.appendChild(fila);
    }
  }

  function mostrarInfo(fechaStr) {
    const info = document.getElementById('info');
    const asig = asignaciones[fechaStr];

    if (!asig) {
      info.innerHTML = `<strong>${fechaStr}</strong> — Sin asignación registrada.`;
      return;
    }

    const nombre = asig.persona === 'Ramon' ? 'Ramón' : asig.persona;
    const color  = COLORES[asig.persona] || '#555';
    const bloque = encontrarBloque(fechaStr, asig.tipo, asig.persona);

    info.innerHTML = `
      <strong style="color:${color}">${nombre}</strong> &nbsp;·&nbsp;
      <strong>${fechaStr}</strong> &nbsp;·&nbsp;
      <em>${TIPO_LABEL[asig.tipo] || asig.tipo}</em>
      ${bloque ? `<br><span style="font-size:0.82rem">Bloque completo: <strong>${bloque.desde}</strong> → <strong>${bloque.hasta}</strong></span>` : ''}
    `;
  }

  function encontrarBloque(fecha, tipo, persona) {
    let d = new Date(fecha + 'T12:00:00');
    let h = new Date(fecha + 'T12:00:00');

    for (;;) {
      const prev = new Date(d); prev.setDate(prev.getDate() - 1);
      const ps = fmt(prev);
      if (asignaciones[ps]?.tipo === tipo && asignaciones[ps]?.persona === persona) d = prev;
      else break;
    }
    for (;;) {
      const next = new Date(h); next.setDate(next.getDate() + 1);
      const ns = fmt(next);
      if (asignaciones[ns]?.tipo === tipo && asignaciones[ns]?.persona === persona) h = next;
      else break;
    }

    if (fmt(d) === fecha && fmt(h) === fecha) return null;
    return { desde: fmt(d), hasta: fmt(h) };
  }

  document.getElementById('btn-prev').addEventListener('click', () => {
    if (mesActual > 0) { mesActual--; renderMes(mesActual); }
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (mesActual < 11) { mesActual++; renderMes(mesActual); }
  });

  renderMes(mesActual);

})();
</script>
</body>
</html>
